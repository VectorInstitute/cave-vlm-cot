[project.urls]
Repository = "https://anonymous.4open.science/r/cave-vlm-cot-XXXX"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# torch / triton / xformers must come from the PyTorch CUDA 12.6 index.
# Plain PyPI only has CPU builds. faiss is loaded as an HPC module (faiss/1.12.0)
# and is intentionally absent from pip deps.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch    = { index = "pytorch-cu126" }
triton   = { index = "pytorch-cu126" }
xformers = { index = "pytorch-cu126" }

[tool.uv]
# Empty by default so `uv sync` only installs runtime deps.
# Use `uv sync --group dev` or `--group docs` explicitly when needed.
default-groups = []

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=1.14.1",
    "nbqa>=1.9.1",
    "pip>=26.0",                # CVE-2026-1703
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.13.3",
]
docs = [
    # jinja2 is already pinned in main deps; listed here for explicitness only
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
]

[tool.mypy]
follow_imports = "normal"
ignore_missing_imports = false
install_types = true
pretty = true
non_interactive = true
allow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
allow_subclassing_any = false
allow_untyped_calls = false
allow_incomplete_defs = false
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
extra_checks = true
mypy_path = "src"

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
exclude = []
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE",
    "D", "E", "F", "I", "W", "N", "ERA", "PL",
]
fixable = [
    "A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE",
    "D", "E", "F", "I", "W", "N", "ERA", "PL",
]
ignore = [
    "B905",    # zip() without explicit strict=
    "E501",    # line too long
    "D203",    # 1 blank line before class docstring
    "D213",    # multi-line docstring summary at second line
    "PLR2004", # magic number
    "PLR0913", # too many arguments
    "COM812",  # missing trailing comma
    "ERA001",  # commented-out code (false positives with math)
    "A001",    # variable shadows builtin `input`
    "A002",    # function arg shadows builtin `input`
    "D301",    # r-strings for docstrings with backslashes
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"tests/*"     = ["D103", "D105", "D107"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
    [tool.coverage.run]
    source = ["src/cite_verify_vlm_cot"]
    omit   = ["tests/*", "*__init__.py"]
[tool.hatch.build.targets.wheel]
packages = ["src/cite_verify_vlm_cot"]
